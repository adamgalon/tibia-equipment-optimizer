name: Update item data

on:
  schedule:
    - cron: '0 5 * * 1' # Mondays 05:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run import:items
      # Only commit when the import produced valid data that passes the tests.
      - run: npm test
      - name: Commit changes
        env:
          # Optional: without this secret the commit message carries the plain change list only.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if git diff --quiet data/; then echo "No data changes."; exit 0; fi
          node scripts/summarize-changes.ts > "$RUNNER_TEMP/changes.txt"
          cat "$RUNNER_TEMP/changes.txt" >> "$GITHUB_STEP_SUMMARY"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          { echo "Update data from TibiaWiki"; echo; cat "$RUNNER_TEMP/changes.txt"; } | git commit -F -
          git push
